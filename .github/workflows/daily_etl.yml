name: Daily ETL Pipeline

on:
  # Trigger manual dari GitHub UI
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Pipeline to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - work_orders
          - service_items
          - gel_sync
      mode:
        description: 'Pipeline mode (full = clear & replace, incremental = append only)'
        required: true
        default: 'incremental'
        type: choice
        options:
          - full
          - incremental

  # Jadwal otomatis (cron) - GitHub uses UTC timezone
  schedule:
    # Work Orders: Jam 17:00 UTC = 00:00 WIB
    - cron: '0 17 * * *'
    # Service Items: Jam 18:00 UTC = 01:00 WIB (1 jam setelah work_orders)
    - cron: '0 18 * * *'
    # GEL Sync: Jam 04:00 UTC = 11:00 WIB (Jumat only)
    - cron: '0 4 * * 5'


jobs:
  # ========================================
  # Job 1: Work Orders Pipeline
  # ========================================
  work-orders:
    runs-on: ubuntu-latest
    # Run if: scheduled at 17:00 UTC OR manual with 'all' or 'work_orders'
    if: >-
      github.event_name == 'schedule' && contains(github.event.schedule, '17') ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.pipeline == 'all' || github.event.inputs.pipeline == 'work_orders')
    
    env:
      SAVE_LOCAL_CSV: ${{ vars.SAVE_LOCAL_CSV }}
      STRICT_COMPLAINT_CLEANING: ${{ vars.STRICT_COMPLAINT_CLEANING }}
      # Pipeline mode: cron uses incremental, manual uses selected mode
      PIPELINE_MODE: ${{ github.event_name == 'schedule' && 'incremental' || github.event.inputs.mode }}
      LOOKBACK_DAYS: "2"
      
      # Worksheet names
      WORKSHEET_FORM_SERVICE: "Service History (2024-Jun 2025)"
      WORKSHEET_SERVICE_GRAB: "Form responses 1"
      WORKSHEET_FORM_RESPONSES: "Form Responses 1"
      WORKSHEET_REQUEST_SPK: "DATA 2025"
      WORKSHEET_AFTER_REPAIR: "List After Repair"
      WORKSHEET_CABANG_KEMBANGAN: "Repair Kmb"
      WORKSHEET_CABANG_DEPOK: "Repair DP"
      WORKSHEET_CABANG_BEKASI: "Repair BK"
      WORKSHEET_ASSET: "ALL BIKE NEW"
      WORKSHEET_MEKANIK: "mekanik list"
      WORKSHEET_TOP_KELUHAN: "top_keluhan"
      WORKSHEET_OUTPUT: "work_orders"
      WORKSHEET_BAD_OUTPUT: "bad_data"
      
      # Sheet IDs dari Secrets
      SHEET_ID_FORM_SERVICE: ${{ secrets.SHEET_ID_FORM_SERVICE }}
      SHEET_ID_SERVICE_GRAB: ${{ secrets.SHEET_ID_SERVICE_GRAB }}
      SHEET_ID_FORM_RESPONSES: ${{ secrets.SHEET_ID_FORM_RESPONSES }}
      SHEET_ID_REQUEST_SPK: ${{ secrets.SHEET_ID_REQUEST_SPK }}
      SHEET_ID_AFTER_REPAIR: ${{ secrets.SHEET_ID_AFTER_REPAIR }}
      SHEET_ID_CABANG_KEMBANGAN: ${{ secrets.SHEET_ID_CABANG_KEMBANGAN }}
      SHEET_ID_CABANG_DEPOK: ${{ secrets.SHEET_ID_CABANG_DEPOK }}
      SHEET_ID_CABANG_BEKASI: ${{ secrets.SHEET_ID_CABANG_BEKASI }}
      SHEET_ID_ASSET_LIST: ${{ secrets.SHEET_ID_ASSET_LIST }}
      SHEET_ID_MEKANIK: ${{ secrets.SHEET_ID_MEKANIK }}
      SHEET_KAMUS_KELUHAN: ${{ secrets.SHEET_KAMUS_KELUHAN }}
      SHEET_ID_OUTPUT: ${{ secrets.SHEET_ID_OUTPUT }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create Google Credentials File
        run: |
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > google_credentials.json
      
      - name: Run Work Orders ETL Pipeline
        run: python -m src.pipelines.work_orders.run
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "./google_credentials.json"
      
      - name: Cleanup Credentials
        if: always()
        run: rm -f google_credentials.json

  # ========================================
  # Job 2: Service Items Pipeline
  # ========================================
  service-items:
    runs-on: ubuntu-latest
    # Run if: scheduled at 18:00 UTC OR manual with 'all' or 'service_items'
    if: >-
      github.event_name == 'schedule' && contains(github.event.schedule, '18') ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.pipeline == 'all' || github.event.inputs.pipeline == 'service_items')
    
    env:
      SAVE_LOCAL_CSV: ${{ vars.SAVE_LOCAL_CSV }}
      
      # Worksheet names
      WORKSHEET_MAPPINGS: "Mappings"
      WORKSHEET_SERVICE_ITEMS: "service_items"
      WORKSHEET_OUTPUT: "work_orders"
      
      # Sheet IDs dari Secrets
      SHEET_ID_OUTPUT: ${{ secrets.SHEET_ID_OUTPUT }}
      SHEET_ID_SERVICE_ITEMS: ${{ secrets.SHEET_ID_SERVICE_ITEMS }}
      SHEET_ID_MAPPINGS: ${{ secrets.SHEET_ID_MAPPINGS }}
      SHEET_ID_ASSET_LIST: ${{ secrets.SHEET_ID_ASSET_LIST }}

      WORKSHEET_ASSET: "ALL BIKE NEW"
      WORKSHEET_IGNORE_PART: "ignore_part"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create Google Credentials File
        run: |
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > google_credentials.json
      
      - name: Run Service Items Pipeline
        run: python -m src.pipelines.service_items.run
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "./google_credentials.json"
      
      - name: Cleanup Credentials
        if: always()
        run: rm -f google_credentials.json

  # ========================================
  # Job 3: GEL Sync to Google Sheets
  # ========================================
  gel-sync:
    runs-on: ubuntu-latest
    # Run if: scheduled Friday at 04:00 UTC OR manual with 'all' or 'gel_sync'
    if: >-
      github.event_name == 'schedule' && contains(github.event.schedule, '4') && contains(github.event.schedule, '5') ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.pipeline == 'all' || github.event.inputs.pipeline == 'gel_sync')
    
    env:
      # GEL/Grab Sync Config
      GRAB_ID_SHEET: ${{ secrets.GRAB_ID_SHEET }}
      SERVICE_HISTORY_GRAB: "SERVICE HISTORY GRAB"
      
      # Neon Connection
      NEON_DB_CONNECTION_STRING: ${{ secrets.NEON_DB_CONNECTION_STRING }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create Google Credentials File
        run: |
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > google_credentials.json
      
      - name: Run GEL Sync to Google Sheets
        run: python -m entrypoint.sync_gel_to_sheets
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "./google_credentials.json"
      
      - name: Cleanup Credentials
        if: always()
        run: rm -f google_credentials.json
